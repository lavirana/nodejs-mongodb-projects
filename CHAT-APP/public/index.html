<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin: 0;
            padding: 20px 24px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
        }

        #messages {
            flex: 1;
            min-height: 320px;
            max-height: 420px;
            overflow-y: auto;
            padding: 16px 20px;
            background: #f7f7fb;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #messages p {
            margin: 0;
            padding: 10px 14px;
            background: #e5e7ff;
            color: #1f2937;
            border-radius: 12px;
            max-width: 75%;
            align-self: flex-start;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }

        .input-row {
            display: flex;
            padding: 16px;
            gap: 10px;
            background: #ffffff;
            border-top: 1px solid #eeeeee;
        }

        #message {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        #message:focus {
            border-color: #4f46e5;
        }

        #sendBtn {
            padding: 12px 20px;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #sendBtn:hover {
            background: #4338ca;
        }

        #sendBtn:active {
            background: #3730a3;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>Chatting</h1>

        <div id="messages"></div>

        <div class="input-row">
            <input type="text" id="message" placeholder="Enter your message">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on("message", (message) => console.log(message));

        document.getElementById('sendBtn').addEventListener('click', (e) => {
            const message = document.getElementById('message').value;
            socket.emit('user-message', message);
        });

        socket.on('message', (message) => {
            const messages = document.getElementById('messages');
            messages.innerHTML += `<p>${message}</p>`;
            messages.scrollTop = messages.scrollHeight;
        });
    </script>

</body>
</html>
